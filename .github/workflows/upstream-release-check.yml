name: Check official Hydra releases

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare published releases with our base
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          latest=$(gh api repos/hydralauncher/hydra/releases/latest --jq .tag_name)
          base=$(node -p "require('./src/shared/local-edition.json').upstreamTag")
          printf '## Official release check\n\nOur base: `%s`\n\nLatest official release: `%s`\n\n' "$base" "$latest" >> "$GITHUB_STEP_SUMMARY"
          if [ "$base" != "$latest" ]; then
            printf 'A new official release needs integration. Follow docs/LOCAL-EDITION.md. This check never installs unmodified official binaries or publishes an untested merge.\n' >> "$GITHUB_STEP_SUMMARY"
            echo 'New official release requires integration.'
            exit 1
          fi
